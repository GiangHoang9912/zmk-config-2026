# Corne v4 (nice!nano v2 / nRF52840) — 2x550mAh, có OLED, KHÔNG có LED

# --- Pin ---
# Deep sleep: ZMK mặc định TẮT. Bật để 1100mAh trụ được nhiều tuần.
CONFIG_ZMK_SLEEP=y
# Đọc pin nửa phải và báo về máy (mặc định chỉ báo nửa trái)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- Kết nối giữa 2 nửa (nửa phải gửi phím qua BLE sang nửa trái) ---
# Hàng đợi mặc định nhỏ (10 gửi / 5 nhận) -> gõ nhanh bị rớt phím ở nửa phải.
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_POSITION_QUEUE_SIZE=30
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=20
# Nhóm cài đặt ZMK dự định đặt làm mặc định, giúp kết nối ổn định hơn
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# --- Màn OLED ---
# TẮT: màn OLED hiện sọc nhiễu -> nhiều khả năng không phải SSD1306.
# Bật lại chỉ khi xác định đúng driver (SH1106/SSD1309...).
# CONFIG_ZMK_DISPLAY=y
# Hiện số % thay vì icon pin
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# Vẽ màn hình bằng luồng RIÊNG, không dùng chung hàng đợi với việc quét phím.
# Mặc định ZMK dùng system work queue -> màn vẽ lại làm nghẽn quét phím (docs/config/displays.md).
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# --- LED ---
# Bàn phím không hỗ trợ LED -> để nguyên tắt
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
